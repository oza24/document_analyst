services:
  - type: web
    name: evidencelens-api
    runtime: node
    buildCommand: npm ci && npm run build --workspace=packages/shared-types && cd backend && npm run build
    startCommand: npm run start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 10000
      - key: USE_MOCK_LLM
        value: false
      - key: NODE_ENV
        value: production
